services:
  app:
    container_name: app
    build:
      context: .
    environment:
      - APP_API_HOST=0.0.0.0
      - MONGODB_HOST=mongodb
    env_file:
      - ./.env
    restart: always
    ports:
      - 8000:8000
    depends_on:
      - mongodb
    volumes:
      - app_data:/var/lib/app/data
  mongodb:
    container_name: mongodb
    image: mongo:latest
    environment:
      - MONGO_INITDB_ROOT_USERNAME=mongodb
      - MONGO_INITDB_ROOT_PASSWORD=mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/var/lib/mongodb/data

volumes:
  app_data:
  mongodb_data:
